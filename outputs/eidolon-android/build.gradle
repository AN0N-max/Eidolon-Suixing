plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'com.eidolon.sc.mobile'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'com.eidolon.sc.mobile'; minSdk 26; targetSdk 35; versionCode 84; versionName '1.28' }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs=['src']; res.srcDirs=['res']; assets.srcDirs=['assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig false }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES']; resources.merges += ['META-INF/LICENSE*','META-INF/NOTICE*'] }
}
layout.buildDirectory.set(file('../../work/android-build-1.28/gradle'))
dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'androidx.work:work-runtime:2.9.1'; implementation 'org.bouncycastle:bcprov-jdk18on:1.86'; implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'androidx.exifinterface:exifinterface:1.3.7' }
